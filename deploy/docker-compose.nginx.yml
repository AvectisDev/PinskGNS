# Nginx reverse proxy + static/media for host-run Daphne (NSSM).
# Postgres, Redis, Daphne and Celery stay on the Windows host.
#
# From this directory:
#   docker compose -f docker-compose.nginx.yml up -d

services:
  nginx:
    image: nginx:alpine
    container_name: pinskgns-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../GNS/static:/var/www/static:ro
      - ../GNS/media:/var/www/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
