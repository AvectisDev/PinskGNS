          title: Дата и время начала
        completed_at:
          type: string
          format: date-time
          nullable: true
          title: Дата и время окончания
        truck:
          allOf:
          - $ref: '#/components/schemas/BalloonsTruck'
          readOnly: true
        trailer:
          type: integer
          nullable: true
          title: Прицеп
        reader_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Номер считывателя
        amount_of_rfid:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество баллонов по rfid
        amount_of_sensor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество баллонов по датчику
        amount_of_ttn:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество баллонов по электронной ТТН
        amount_of_5_liters:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество 5л баллонов
        amount_of_12_liters:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество 12л баллонов
        amount_of_27_liters:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество 27л баллонов
        amount_of_50_liters:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Количество 50л баллонов
        gas_amount:
          type: number
          format: double
          nullable: true
          title: Количество принятого газа
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
