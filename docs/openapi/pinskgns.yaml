openapi: 3.0.3
info:
  title: Balloon Management API
  version: 1.0.0
  description: API for managing gas balloons, loading/unloading batches and integration
    with Miriada system
paths:
  /api/app/apk/:
    get:
      operationId: api_app_apk_retrieve
      tags:
      - api
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/app/version/:
    get:
      operationId: api_app_version_retrieve
      tags:
      - api
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auto-gas-batch/:
    get:
      operationId: api_auto_gas_batch_list
      description: Получение списка активных партий автоцистерн за сегодня
      summary: Получить активные партии
      tags:
      - Автоцистерны
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoGasBatch'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: api_auto_gas_batch_create
      description: Создание новой партии автоцистерн
      summary: Создать новую партию
      tags:
      - Автоцистерны
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGasBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AutoGasBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AutoGasBatchRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGasBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/auto-gas-batch/{id}/:
    patch:
      operationId: api_auto_gas_batch_partial_update
      description: Частичное обновление данных партии автоцистерн
      summary: Обновить партию
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Автоцистерны
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAutoGasBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAutoGasBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAutoGasBatchRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGasBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/auto-gas-batch/statistic/:
    get:
      operationId: api_auto_gas_batch_statistic_retrieve
      description: Получение сводной статистики по партиям автоцистерн. Включает статистику
        за последний месяц и за сегодня, а также информацию об активной партии.
      summary: Получить статистику по автоцистернам
      tags:
      - Автоцистерны
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПримерОтвета:
                  value:
                    loading_batch:
                      ПБА:
                        gas_type: ПБА
                        batch_type: l
                        last_month_loading_batches: 15
                        last_month_loading_weight: 200000.5
                        today_loading_batches: 2
                        today_loading_weight: 30000.0
                      СПБТ:
                        gas_type: СПБТ
                        batch_type: l
                        last_month_loading_batches: 10
                        last_month_loading_weight: 150000.25
                        today_loading_batches: 1
                        today_loading_weight: 15000.0
                    unloading_batch:
                      ПБА:
                        gas_type: ПБА
                        batch_type: u
                        last_month_unloading_batches: 12
                        last_month_unloading_weight: 180000.0
                        today_unloading_batches: 1
                        today_unloading_weight: 15000.0
                    active_batch:
                      batch_type: Приёмка
                      gas_type: ПБА
                      car_brand: МАЗ
                      truck_number: AM12347
                      trailer_number: AB12347
                      truck_gas_capacity: 20000.0
                      scale_empty_weight: 15000.0
                      scale_full_weight: 35000.0
                  summary: Пример ответа
          description: ''
  /api/balloon-status-options:
    get:
      operationId: api_balloon_status_options_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/balloons/:
    post:
      operationId: api_balloons_create
      description: Создание нового баллона с проверкой уникальности NFC метки
      summary: Создать новый баллон
      tags:
      - Баллоны
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalloonRequest'
            examples:
              ПримерЗапроса:
                value:
                  nfc_tag: 1234567890ABCDEF
                  serial_number: B12345
                  size: 50
                  netto: 18.5
                  brutto: 40.2
                  status: На складе
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalloonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalloonRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balloon'
              examples:
                УспешныйОтвет:
                  value:
                    nfc_tag: 1234567890ABCDEF
                    serial_number: B12345
                    size: 50
                    netto: 18.5
                    brutto: 40.2
                    status: На складе
                    filling_status: true
                  summary: Успешный ответ
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonCreateError'
              examples:
                ОшибкаВалидации:
                  value:
                    errors:
                      size:
                      - Обязательное поле.
                      netto:
                      - Введите число.
                  summary: Ошибка валидации
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                КонфликтNFCМетки:
                  value:
                    detail: Баллон с такой NFC меткой уже существует
                  summary: Конфликт NFC метки
          description: ''
  /api/balloons-loading/:
    post:
      operationId: api_balloons_loading_create
      description: 'Создание партии с привязкой к ТТН. Обязательно поле `amount_of_ttn`.
        По умолчанию `status`: 1 (ACTIVE). При создании активной партии другие активные
        партии на том же считывателе за сегодня автоматически переводятся в 2 (PAUSED).'
      summary: Создать новую партию
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/{id}/:
    patch:
      operationId: api_balloons_loading_partial_update
      description: |-
        Частичное обновление полей партии (счётчики, транспорт, ТТН и т.д.).

        **Завершение партии:** передайте `"status": 3` (COMPLETED). Отправляются статусы баллонов в Мириаду и закрывается ТТН. Доступно для статусов 1=ACTIVE и 2=PAUSED. При ошибке Мириады партия переходит в 4=MIRIADA_ERROR (ответ HTTP 502).

        Устаревший способ (обратная совместимость): `"is_active": false`. Поле `is_active` удалено из модели — используйте `status`.
      summary: Обновить или завершить партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/{id}/add-balloon/:
    patch:
      operationId: api_balloons_loading_add_balloon_partial_update
      description: Добавление баллона по NFC-метке. Статус в Мириаду отправляется
        при закрытии партии. Доступно для статусов 1=ACTIVE и 2=PAUSED.
      summary: Добавить баллон в партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddBalloonRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddBalloonRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddBalloonRequestRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
  /api/balloons-loading/{id}/pause/:
    post:
      operationId: api_balloons_loading_pause_create
      description: Переводит партию из 1=ACTIVE в 2=PAUSED. RFID и датчик перестают
        добавлять баллоны; ручное добавление и удаление остаётся доступным.
      summary: Приостановить партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/{id}/remove-balloon/:
    patch:
      operationId: api_balloons_loading_remove_balloon_partial_update
      description: Удаление баллона по NFC-метке. Доступно для статусов 1=ACTIVE и
        2=PAUSED.
      summary: Удалить баллон из партии
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRemoveBalloonRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRemoveBalloonRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRemoveBalloonRequestRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonOperationResponse'
          description: ''
  /api/balloons-loading/{id}/resume/:
    post:
      operationId: api_balloons_loading_resume_create
      description: Переводит партию из 2=PAUSED в 1=ACTIVE. Другие активные партии
        на том же считывателе за сегодня автоматически переводятся в 2=PAUSED.
      summary: Возобновить партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/{id}/retry-close/:
    post:
      operationId: api_balloons_loading_retry_close_create
      description: Сохраняет данные партии, отправляет статусы баллонов в Мириаду
        и закрывает ТТН. Завершение возможно только если количество RFID совпадает
        с количеством по электронной ТТН. Доступно для статусов 1=ACTIVE, 2=PAUSED
        и 4=MIRIADA_ERROR (повтор после ошибки Мириады).
      summary: Повторно завершить партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/{id}/rfid-amount/:
    get:
      operationId: api_balloons_loading_rfid_amount_retrieve
      description: 'Количество баллонов в партии: RFID, оптический датчик и электронная
        ТТН'
      summary: Количество баллонов по RFID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonAmount'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/active/:
    get:
      operationId: api_balloons_loading_active_list
      description: 'Список партий, которые ещё не завершены успешно: status ∈ {1=ACTIVE,
        2=PAUSED, 4=MIRIADA_ERROR}. Статус партии (числовой enum): 1=ACTIVE — в работе
        (RFID принимает баллоны); 2=PAUSED — приостановлена (ручное добавление/удаление
        доступно); 3=COMPLETED — завершена; 4=MIRIADA_ERROR — ошибка закрытия ТТН
        в Мириаде. 0=UNSPECIFIED не используется.'
      summary: Получить незавершённые партии
      parameters:
      - in: query
        name: batch_type
        schema:
          type: string
          enum:
          - l
          - u
        description: 'Тип партии: l (приёмка) или u (отгрузка)'
      tags:
      - Партии баллонов
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-loading/last-active/:
    get:
      operationId: api_balloons_loading_last_active_retrieve
      description: Последняя партия со статусом 1=ACTIVE (принимает RFID). Партии
        в 2=PAUSED или 4=MIRIADA_ERROR не возвращаются.
      summary: Получить текущую активную партию
      parameters:
      - in: query
        name: batch_type
        schema:
          type: string
          enum:
          - l
          - u
        description: 'Тип партии: l (приёмка) или u (отгрузка)'
      tags:
      - Партии баллонов
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-unloading/:
    post:
      operationId: api_balloons_unloading_create
      description: 'Создание партии с привязкой к ТТН. Обязательно поле `amount_of_ttn`.
        По умолчанию `status`: 1 (ACTIVE). При создании активной партии другие активные
        партии на том же считывателе за сегодня автоматически переводятся в 2 (PAUSED).'
      summary: Создать новую партию
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalloonsBatchRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalloonsBatch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/balloons-unloading/{id}/:
    patch:
      operationId: api_balloons_unloading_partial_update
      description: |-
        Частичное обновление полей партии (счётчики, транспорт, ТТН и т.д.).

        **Завершение партии:** передайте `"status": 3` (COMPLETED). Отправляются статусы баллонов в Мириаду и закрывается ТТН. Доступно для статусов 1=ACTIVE и 2=PAUSED. При ошибке Мириады партия переходит в 4=MIRIADA_ERROR (ответ HTTP 502).

        Устаревший способ (обратная совместимость): `"is_active": false`. Поле `is_active` удалено из модели — используйте `status`.
      summary: Обновить или завершить партию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID партии
        required: true
      tags:
      - Партии баллонов
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBalloonsBatchRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      - bearerAuth: []
